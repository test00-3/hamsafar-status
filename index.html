<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>همسفر — لینک‌های فعال</title>
<style>
  body{font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#0D47A1,#1565C0);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
  .card{background:#fff;border-radius:22px;max-width:430px;width:100%;padding:26px;box-sizing:border-box;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  h1{color:#0D47A1;font-size:22px;margin:0 0 4px;text-align:center}
  .sub{color:#64748B;font-size:13px;text-align:center;margin-bottom:20px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9CA3AF;margin-left:6px;vertical-align:middle}
  .dot.ok{background:#22C55E;animation:p 1.5s infinite}
  @keyframes p{50%{opacity:.35}}
  .url{direction:ltr;background:#F1F5F9;border-radius:10px;padding:9px;font-size:12px;color:#334155;text-align:center;margin:12px 0;word-break:break-all}
  a.btn{display:block;text-decoration:none;text-align:center;padding:14px;border-radius:13px;font-weight:bold;font-size:15.5px;margin:9px 0;background:#0D47A1;color:#fff}
  a.btn.alt{background:#fff;color:#0D47A1;border:2px solid #0D47A1}
  .foot{color:#94A3B8;font-size:11px;text-align:center;margin-top:16px}
  .err{color:#B91C1C;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>🚌 همسفر</h1>
  <div class="sub">لینک‌های فعال سیستم <span id="dot" class="dot"></span><span id="st">در حال بررسی...</span></div>
  <div class="url" id="u">...</div>
  <div id="links" style="display:none">
    <a class="btn" href="#" id="b_app">📲 اپلیکیشن مسافر</a>
    <a class="btn alt" href="#" id="b_site">🌐 وبسایت</a>
    <a class="btn alt" href="#" id="b_apk">⬇️ دانلود اپ اندروید (APK)</a>
    <a class="btn alt" href="#" id="b_docs">📚 مستندات</a>
  </div>
  <div class="err" id="err" style="display:none"></div>
  <div class="foot">© Kamall Hemmat ICT Co — 0773022090<br>این صفحه ثابت است و همیشه آخرین آدرس فعال را نشان می‌دهد</div>
</div>
<script>
(async function(){
  const tries = [
    "https://raw.githubusercontent.com/test00-3/hamsafar-status/main/url.json",
    "https://api.github.com/repos/test00-3/hamsafar-status/contents/url.json"
  ];
  let url = null;
  for (const t of tries) {
    try {
      const r = await fetch(t + (t.includes("raw") ? "?v=" + Date.now() : ""), {cache: "no-store"});
      if (r.ok) { const j = await r.json();
        if (t.includes("api")) { url = JSON.parse(atob(j.content)).url; } else { url = j.url; }
        if (url) break;
      }
    } catch(e) {}
  }
  if (!url) {
    document.getElementById("st").textContent = "اتصال برقرار نیست";
    document.getElementById("err").style.display = "block";
    document.getElementById("err").textContent = "اتصال اینترنت خود را بررسی کنید و صفحه را رفرش کنید";
    return;
  }
  document.getElementById("dot").className = "dot ok";
  document.getElementById("st").textContent = "فعال";
  document.getElementById("u").textContent = url;
  const map = {b_app:"/app/", b_site:"/site/", b_apk:"/download/hamsafar.apk", b_docs:"/documentation/"};
  document.getElementById("links").style.display = "block";
  for (const id in map) document.getElementById(id).href = url + map[id];
})();
</script>
</body>
</html>
